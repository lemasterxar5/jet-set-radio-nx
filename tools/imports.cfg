# The game's modules whose imports the table must cover (the APK's lib/armeabi-v7a/).
# Both builds are listed: they hold the same game and import the same set, and
# [jsr] library picks which one to load.
MODULES libjetsetradio.so libjetsetradio-nn.so

# The Boehm GC probes the data segment's start and its own hooks with weak
# symbols it tests for; NULL is what Android's libgc.so exports for them.
WEAK_NULL __data_start the GC's data-segment probe
WEAK_NULL __dso_handle the GC's DSO handle (no dlopen in this port)
WEAK_NULL __atexit the GC registers an exit hook through it